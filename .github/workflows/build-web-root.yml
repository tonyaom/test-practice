name: Build Expo Web To Root

on:
  push:
    branches: [main]
    paths:
      - 'App.js'
      - 'index.js'
      - 'app.json'
      - 'package.json'
      - '.github/workflows/build-web-root.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: expo-web-root
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Export Expo web
        run: npm run build:web

      - name: Copy web build to repository root
        run: |
          cp -a dist/. .
          rm -rf dist
          touch .nojekyll

      - name: Commit generated root build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No build changes to commit"
            exit 0
          fi
          git commit -m "Build Expo web to repository root [skip expo build]"
          git push origin HEAD:main
